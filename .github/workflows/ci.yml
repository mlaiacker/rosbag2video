name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install flake8
        run: pip install flake8
      
      - name: Static analysis
        run: flake8 rosbag2video.py

      - name: Install pycodestyle
        run: pip install pycodestyle
      
      - name: PEP8 style checks
        run: pycodestyle rosbag2video.py
